<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
  <title id="title">QA Router — architecture at a glance</title>
  <desc id="desc">The user asks the primary agent to perform QA work. The primary agent retrieves source evidence, delegates bounded routine drafts to local Qwen through QA Router, optionally consults a read-only Sol deep reviewer, and reviews the final result. Draft feedback and task metrics are recorded without task content. The primary agent owns decisions and authorized external writes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#91a9ca" stroke-width="1.7"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#6cdbc3" stroke-width="1.7"/></marker>
  </defs>
  <style>
    text {font-family:Arial,Helvetica,sans-serif}
    .title {font-size:42px;font-weight:700;fill:#f5f8ff}
    .head {font-size:28px;font-weight:700;fill:#f5f8ff}
    .body {font-size:23px;fill:#c1cee0}
    .label {font-size:17px;letter-spacing:1.5px;font-weight:700;fill:#82a9dd}
    .note {font-size:19px;fill:#a9bad0}
    .link {fill:none;stroke:#91a9ca;stroke-width:2.5;marker-end:url(#arrow)}
    .local {fill:none;stroke:#6cdbc3;stroke-width:2.5;marker-end:url(#teal)}
  </style>
  <rect width="1440" height="1010" rx="28" fill="#0c1526"/>
  <text x="48" y="55" class="label">QA ROUTER MCP / OVERVIEW</text>
  <text x="48" y="110" class="title">One orchestrator. Focused delegation.</text>
  <text x="48" y="145" class="body">Local drafts and optional deep analysis support a host-reviewed result.</text>

  <rect x="488" y="184" width="464" height="88" rx="18" fill="#192a43" stroke="#3e587b"/>
  <text x="720" y="222" text-anchor="middle" class="head">Your QA request</text>
  <text x="720" y="252" text-anchor="middle" class="note">Review · coverage · logs · automation</text>
  <path d="M720 272 V332" class="link"/>

  <rect x="48" y="332" width="360" height="226" rx="20" fill="#17263e" stroke="#30435e"/>
  <text x="72" y="367" class="label">AUTHORITATIVE INPUTS</text>
  <text x="72" y="407" class="head">Sources and code</text>
  <text x="72" y="447" class="body">Jira · GitLab · TestRail</text>
  <text x="72" y="482" class="body">Logs · monitoring · docs</text>
  <text x="72" y="517" class="body">Local code + CodeGraph</text>
  <path d="M408 440 H488" class="link"/>
  <text x="448" y="425" text-anchor="middle" class="note">facts</text>

  <rect x="488" y="332" width="464" height="226" rx="20" fill="#203754" stroke="#82a9dd" stroke-width="2"/>
  <text x="512" y="367" class="label">CONFIGURED PRIMARY AGENT</text>
  <text x="512" y="407" class="head">Host orchestrator</text>
  <text x="512" y="447" class="body">Codex / Claude Code / Cursor</text>
  <text x="512" y="482" class="body">Analyze evidence · choose coverage</text>
  <text x="512" y="517" class="body">Sanitize packets · review all outputs</text>

  <rect x="1032" y="332" width="360" height="226" rx="20" fill="#123537" stroke="#6cdbc3"/>
  <text x="1056" y="367" class="label" style="fill:#6cdbc3">LOCAL ROUTINE WORK</text>
  <text x="1056" y="407" class="head">QA Router → Qwen</text>
  <text x="1056" y="447" class="body">Qwen3.5-9B · LM Studio</text>
  <text x="1056" y="482" class="body">Checks → draft → validation</text>
  <text x="1056" y="517" class="body">No source access or writes</text>
  <path d="M952 400 H1032" class="local"/>
  <path d="M1032 500 H952" class="local"/>
  <text x="992" y="384" text-anchor="middle" class="note">task</text>
  <text x="992" y="530" text-anchor="middle" class="note">draft*</text>

  <path d="M560 558 V650 H228 V724" class="link" stroke-dasharray="7 7" marker-start="url(#arrow)"/>
  <text x="264" y="634" class="note">Optional consultation</text>
  <path d="M720 558 V724" class="link"/>
  <text x="744" y="625" class="note">Check, correct</text>
  <text x="744" y="652" class="note">or discard drafts</text>
  <text x="1056" y="614" class="note">Cases · log groups · summaries</text>
  <text x="1056" y="644" class="note">Translation · rewrites · skeletons</text>
  <text x="1056" y="674" class="note">Short explanations on request</text>

  <rect x="48" y="724" width="360" height="164" rx="20" fill="#292a43" stroke="#737299"/>
  <text x="72" y="758" class="label" style="fill:#b8b3e9">HOST-OWNED DEEP REVIEW</text>
  <text x="72" y="797" class="head">qa_deep · Sol / high</text>
  <text x="72" y="834" class="body">Complex risks · read-only</text>
  <text x="72" y="866" class="note">Current workspace configuration</text>

  <rect x="488" y="724" width="464" height="164" rx="20" fill="#173d3c" stroke="#6cdbc3"/>
  <text x="512" y="758" class="label" style="fill:#6cdbc3">HOST-REVIEWED RESULT</text>
  <text x="512" y="797" class="head">Final QA output</text>
  <text x="512" y="834" class="body">Findings · test plans · verified drafts</text>
  <text x="512" y="866" class="note">Host owns decisions and authorized writes</text>

  <path d="M952 810 H1032" class="link"/>
  <rect x="1032" y="724" width="360" height="164" rx="20" fill="#17263e" stroke="#30435e"/>
  <text x="1056" y="758" class="label">ROUTER FEEDBACK</text>
  <text x="1056" y="797" class="head">Quality and metrics</text>
  <text x="1056" y="834" class="body">Ratings · tokens · latency</text>
  <text x="1056" y="866" class="note">Informs future routes; no task text</text>

  <text x="48" y="942" class="note">* A refusal or failure returns control to the host. Every successful local response is still an unverified draft.</text>
  <text x="48" y="976" class="note">Deep analysis is called by the host, outside QA Router. No automatic Astra route or persistent QA memory.</text>
</svg>
