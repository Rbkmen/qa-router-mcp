<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2110" viewBox="0 0 1440 2110" role="img" aria-labelledby="title desc">
<title id="title">QA Router MCP — from evidence to reviewed QA drafts</title>
<desc id="desc">The configured host agent retrieves evidence, selects bounded tasks, and calls a local MCP server. QA Router checks policy and token limits, generates through Qwen3.5-9B in LM Studio, validates the result, and returns a draft or fallback. The host reviews every draft, owns all external writes, and submits content-free quality feedback. Optional Sol deep analysis is owned by the host, outside the local router.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7896b9" stroke-width="1.8"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6cdbc3" stroke-width="1.8"/></marker></defs>
<rect width="1440" height="2110" rx="28" fill="#0c1526"/>
<style>text {font-family:Arial,Helvetica,sans-serif} .body {font-size:22px;fill:#c1cee0} .small {font-size:19px;fill:#9baec8} .head {font-size:27px;font-weight:700;fill:#f5f8ff} .label {font-size:19px;font-weight:700;letter-spacing:1.5px;fill:#82a9dd} .mono {font-family:Menlo,Consolas,monospace;font-size:19px;fill:#b1e9e0}</style>
<text x="48" y="65" class="label">QA ROUTER MCP</text>
<text x="48" y="122" fill="#f5f8ff" font-size="47" font-weight="700">Evidence in. Reviewed drafts out.</text>
<text x="48" y="161" class="body">A local drafting service inside a host-controlled QA workflow.</text>
<rect x="1027" y="40" width="365" height="34" rx="17" fill="#17263e" stroke="#30435e"/>
<text x="1043" y="63" class="small" style="fill:#82a9dd;">CURRENT PROFILE · router-v11</text>
<rect x="32" y="196" width="1376" height="415" rx="22" fill="#111e32" stroke="#30435e"/>
<text x="56" y="234" class="label">01 / HOST AGENT · DECISIONS AND EVIDENCE</text>
<rect x="56" y="260" width="374" height="158" rx="16" fill="#17263e" stroke="#30435e"/>
<text x="80" y="300" class="head">Authoritative sources</text>
<text x="80" y="336" class="body">Jira · GitLab · TestRail</text>
<text x="80" y="368" class="body">Logs, monitoring and team docs</text>
<text x="80" y="400" class="body">Local code + scoped CodeGraph</text>
<rect x="490" y="260" width="450" height="158" rx="16" fill="#17263e" stroke="#30435e"/>
<rect x="491" y="280" width="4" height="118" rx="2" fill="#82a9dd"/>
<text x="514" y="300" class="head">Configured primary agent</text>
<text x="514" y="336" class="body">Codex / Claude Code / Cursor</text>
<text x="514" y="368" class="body">Retrieve → analyze → select task</text>
<text x="514" y="400" class="body">Build a small, sanitized packet</text>
<rect x="1000" y="260" width="382" height="158" rx="16" fill="#17263e" stroke="#30435e"/>
<text x="1024" y="300" class="head">Optional deep analysis</text>
<text x="1024" y="336" class="body">Current workspace: Sol / high</text>
<text x="1024" y="368" class="body">One bounded, read-only qa_deep</text>
<text x="1024" y="400" class="body">Called by host; outside router</text>
<path d="M430,338 L490,338" fill="none" stroke="#7896b9" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M940,338 L1000,338" fill="none" stroke="#7896b9" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<rect x="56" y="446" width="1326" height="137" rx="16" fill="#192a43" stroke="#3e587b"/>
<text x="80" y="478" class="label">HOST ROUTING RULES</text>
<text x="80" y="514" class="body">Test cases: 4–12 approved items</text>
<text x="80" y="545" class="body">Logs: ≥6,000 sanitized characters</text>
<text x="512" y="514" class="body">Summaries: ≥4,000 characters</text>
<text x="512" y="545" class="body">Translation / rewrite: ≥2,000 chars</text>
<text x="976" y="514" class="body">Skeleton: scenario + project pattern</text>
<text x="976" y="545" class="body">Small tasks stay with the host</text>
<text x="58" y="643" class="small">Explicit local requests may override size thresholds. Short explanations require an explicit request.</text>
<path d="M715,583 L715,609" fill="none" stroke="#7896b9" stroke-width="2.4"/>
<rect x="32" y="672" width="1376" height="774" rx="22" fill="#102b31" stroke="#39756c"/>
<text x="56" y="711" class="label" style="fill:#6cdbc3;">02 / LOCAL MACHINE · STDIO MCP → QA ROUTER → LOOPBACK LM STUDIO</text>
<rect x="56" y="740" width="626" height="170" rx="16" fill="#17263e" stroke="#30435e"/>
<rect x="57" y="760" width="4" height="130" rx="2" fill="#6cdbc3"/>
<text x="80" y="780" class="head">1. Gate and sanitize</text>
<text x="80" y="816" class="body">Enabled? Tool quality paused? Check before inference.</text>
<text x="80" y="848" class="body">Reject detected secrets, sensitive data and QA decisions.</text>
<text x="80" y="880" class="body">Apply size limits; replace identifiers, URLs and paths.</text>
<rect x="756" y="740" width="626" height="170" rx="16" fill="#17263e" stroke="#30435e"/>
<rect x="757" y="760" width="4" height="130" rx="2" fill="#6cdbc3"/>
<text x="780" y="780" class="head">2. Build prompt and count tokens</text>
<text x="780" y="816" class="body">Task-specific instructions + approved COV-* skeleton.</text>
<text x="780" y="848" class="body">Tokenize using the loaded local model and template.</text>
<text x="780" y="880" class="body">Prompt + adaptive output + 512 reserve ≤ 16,384.</text>
<path d="M682,825 L756,825" fill="none" stroke="#6cdbc3" stroke-width="2.4" marker-end="url(#green)"/>
<rect x="756" y="970" width="626" height="178" rx="16" fill="#17263e" stroke="#30435e"/>
<rect x="757" y="990" width="4" height="138" rx="2" fill="#6cdbc3"/>
<text x="780" y="1010" class="head">3. Generate a bounded draft</text>
<text x="780" y="1046" class="body">Qwen3.5-9B · LM Studio / MLX · 127.0.0.1:1234</text>
<text x="780" y="1078" class="body">Structured JSON output; up to 3,072 output tokens.</text>
<text x="780" y="1110" class="body">Serialized model operations; idle TTL: 300 seconds.</text>
<path d="M1069,910 L1069,970" fill="none" stroke="#6cdbc3" stroke-width="2.4" marker-end="url(#green)"/>
<rect x="56" y="970" width="626" height="178" rx="16" fill="#17263e" stroke="#30435e"/>
<rect x="57" y="990" width="4" height="138" rx="2" fill="#6cdbc3"/>
<text x="80" y="1010" class="head">4. Validate the returned artifact</text>
<text x="80" y="1046" class="body">Envelope, truncation and tool-specific checks.</text>
<text x="80" y="1078" class="body">Test cases: exact IDs, count and required fields.</text>
<text x="80" y="1110" class="body">Known write patterns blocked; host checks meaning.</text>
<path d="M756,1055 L682,1055" fill="none" stroke="#6cdbc3" stroke-width="2.4" marker-end="url(#green)"/>
<rect x="56" y="1184" width="1326" height="84" rx="16" fill="#16363b" stroke="#39756c"/>
<text x="80" y="1217" class="label" style="fill:#6cdbc3;">BOUNDED RECOVERY</text>
<text x="80" y="1249" class="body">Transport: one retry per request · JSON schema: one repair · Artifact validation: one repair</text>
<text x="56" y="1298" class="small">Every repair rechecks context capacity. Exhausted retries or invalid output return control to the host.</text>
<rect x="56" y="1323" width="626" height="92" rx="16" fill="#173d3c" stroke="#448f81"/>
<text x="80" y="1357" class="label" style="fill:#6cdbc3;">OK → UNVERIFIED DRAFT</text>
<text x="80" y="1389" class="small">draft + assumptions + unverified + quality / feedback flags</text>
<rect x="756" y="1323" width="626" height="92" rx="16" fill="#3b2932" stroke="#93606b"/>
<text x="780" y="1357" class="label" style="fill:#f0b3bc;">REFUSED / FALLBACK → HOST CONTINUES</text>
<text x="780" y="1389" class="small">Policy or budget rejection; paused, disabled or failed route</text>
<path d="M369,1415 L369,1470" fill="none" stroke="#6cdbc3" stroke-width="2.4" marker-end="url(#green)"/>
<path d="M1069,1415 L1069,1470" fill="none" stroke="#7896b9" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="32" y="1470" width="1376" height="182" rx="22" fill="#18243e" stroke="#5b7396"/>
<text x="56" y="1509" class="label">03 / HOST REVIEW · FINAL RESPONSIBILITY</text>
<text x="56" y="1552" class="head">Check every draft against evidence → correct or discard → deliver the final result</text>
<text x="56" y="1593" class="body">Coverage, severity, release decisions, code changes and authorized external writes belong to the host.</text>
<text x="56" y="1626" class="small">A local “ok” confirms validator acceptance. It does not establish factual accuracy or permission to act.</text>
<path d="M720,1652 L720,1694" fill="none" stroke="#7896b9" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="32" y="1694" width="1376" height="338" rx="22" fill="#111e32" stroke="#30435e"/>
<text x="56" y="1732" class="label">04 / FEEDBACK AND MEASUREMENT · NO TASK CONTENT STORED</text>
<rect x="56" y="1756" width="626" height="192" rx="16" fill="#17263e" stroke="#30435e"/>
<text x="80" y="1796" class="head">Per-tool quality gate</text>
<text x="80" y="1832" class="body">Initial feedback collected for every tool / profile.</text>
<text x="80" y="1864" class="body">At 10+ reviews, assess the latest 20 reviews:</text>
<text x="80" y="1896" class="body">≥20% serious corrections → paused (takes priority).</text>
<text x="80" y="1928" class="body">Otherwise ≥80% acceptable → active; else canary.</text>
<rect x="756" y="1756" width="626" height="192" rx="16" fill="#17263e" stroke="#30435e"/>
<text x="780" y="1796" class="head">Content-free operational metrics</text>
<text x="780" y="1832" class="body">Latency, tokens, outcomes, repairs and truncations.</text>
<text x="780" y="1864" class="body">Draft feedback + one outcome per completed QA task.</text>
<text x="780" y="1896" class="body">CodeGraph/source counters; optional deep_* metrics.</text>
<text x="780" y="1928" class="body">JSONL retention: 30 days / 10,000 events by default.</text>
<text x="56" y="1982" class="body">≈10% shadow sample: host produces a separate baseline and compares it with the local draft.</text>
<text x="56" y="2014" class="small">Feedback changes subsequent routing state. It does not train Qwen or create persistent QA memory.</text>
<text x="48" y="2068" class="small">Solid arrows: main flow    ·    Dashed: optional host delegation    ·    The router never initiates a cloud call</text>
</svg>
